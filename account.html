<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your Cypher-School account."><title>My Account | Cypher-School</title><link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header"><div class="nav-wrap"><a class="brand" href="index.html">CYPHER-SCHOOL // HUB</a><nav data-account-nav aria-label="Account navigation"><a href="courses.html">Courses</a><a href="dashboard.html">Dashboard</a></nav></div></header>
    <main class="form-page"><section class="form-container"><p class="eyebrow">Profile settings</p><h1>Manage your account</h1><p>Update your profile details or account password.</p>
      <form id="account-form"><label for="account-name">Full name</label><input id="account-name" name="fullname" autocomplete="name" required><label for="account-username">Username</label><input id="account-username" name="username" autocomplete="username" required><label for="account-email">Email address</label><input id="account-email" name="email" type="email" autocomplete="email" required><label for="account-bio">About you</label><textarea id="account-bio" name="bio" rows="4" maxlength="240" placeholder="A short profile note"></textarea><button type="submit">Save profile</button><p data-feedback class="notice form-message" role="status" hidden></p><hr><button class="danger-button" type="button" data-delete-account>Delete my account</button></form>
      <form id="password-form"><h2 class="account-subheading">Change password</h2><label for="current-password">Current password</label><input id="current-password" name="current-password" type="password" autocomplete="current-password" required><label for="new-password">New password (10+ characters)</label><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="10" required><label for="confirm-new-password">Confirm new password</label><input id="confirm-new-password" name="confirm-password" type="password" autocomplete="new-password" minlength="10" required><button type="submit">Update password</button><p data-feedback class="notice form-message" role="status" hidden></p></form>
    </section></main><footer>By lwis Wanyonyi (CYPHER) © 2026 Cypher-School · Learn ethically. Build responsibly</footer><script src="app.js"></script>
  </body>
</html>
